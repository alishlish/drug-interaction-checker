  absent_drugs: [simvastatin]
  expect: correct_refused
- id: absent_metformin
  category: absent
  drugs: [metformin, azilsartan]
  absent_drugs: [metformin]
  expect: correct_refused
- id: absent_aspirin
  category: absent
  drugs: [aspirin, azilsartan]
  absent_drugs: [aspirin]
  expect: correct_refused
- id: absent_amoxicillin
  category: absent
