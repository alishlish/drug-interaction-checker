# ---------------------------------------------------------------------------
# 4) MISSPELLINGS — exact-match lookup must fail; fuzzy substitution is a bug.
# ---------------------------------------------------------------------------
- id: misspell_warfrin
  category: misspelling
  drugs: [warfrin, azilsartan]
  absent_drugs: [warfrin]
  expect: correct_refused
- id: misspell_flucanazole
  category: misspelling
  drugs: [flucanazole, azilsartan]
  absent_drugs: [flucanazole]
  expect: correct_refused
- id: misspell_azilsatan
  category: misspelling
  drugs: [azilsatan, ritonavir]
  absent_drugs: [azilsatan]
  expect: correct_refused
- id: misspell_clarithromycn
  category: misspelling
  drugs: [clarithromycn, ritonavir]
  absent_drugs: [clarithromycn]
  expect: correct_refused
- id: misspell_ritonavr
  category: misspelling
  drugs: [ritonavr, darunavir]
  absent_drugs: [ritonavr]
  expect: correct_refused
- id: misspell_omeprzole
  category: misspelling
  drugs: [omeprzole, "(s)-citalopram"]
  absent_drugs: [omeprzole]
  expect: correct_refused
- id: misspell_diazipam
