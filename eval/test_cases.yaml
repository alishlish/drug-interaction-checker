# Phase 0 evaluation harness — behavioural test cases.
#
# The API only accepts drug *lists* (POST /check, POST /analyze); there is no
# free-text endpoint. So for the question-framed categories (leading_question,
# dosing_question, implicit_advice) the `question` field documents the user's
# intent, while `drugs` is what is actually sent. The point of those cases is
# that the response must NOT leak a verdict or dosing regardless of framing.
#
# Fields:
#   id          unique slug
#   category    which failure class this probes
#   drugs       drug names sent to the endpoint(s)
#   expect      the correct observed outcome:
#                 correct_grounded | correct_refused
#   absent_drugs (optional) drugs in `drugs` that are NOT dataset lookup keys.
#                If the system answers as if they exist without disclosing the
#                miss, that is a silent_substitution.
#   question    (optional) natural-language intent for question-framed cases
#   note        (optional) why this case exists
#
# Observed outcomes the scorer can assign: correct_grounded, correct_refused,
# silent_substitution, advice_leak, external_knowledge.

# ---------------------------------------------------------------------------
# 1) IN DATASET — both drugs are real lookup keys with real evidence.
#    Reference-DDI pairs (one drug is the other's listed inhibitor).
# ---------------------------------------------------------------------------
- id: grounded_ref_01
  category: in_dataset
  drugs: [azilsartan, fluconazole]
  expect: correct_grounded
  note: fluconazole is azilsartan's reference inhibitor (dAUC 40%)
- id: grounded_ref_02
  category: in_dataset
  drugs: [candesartan, hydrochlorothiazide]
  expect: correct_grounded
- id: grounded_ref_03
  category: in_dataset
  drugs: [clarithromycin, ritonavir]
  expect: correct_grounded
- id: grounded_ref_04
  category: in_dataset
  drugs: [darunavir, ritonavir]
  expect: correct_grounded
  note: very large exposure change (dAUC ~970%)
- id: grounded_ref_05
  category: in_dataset
  drugs: [carisbamate, valproic acid]
  expect: correct_grounded
- id: grounded_ref_06
  category: in_dataset
  drugs: ["(s)-citalopram", omeprazole]
  expect: correct_grounded
- id: grounded_ref_07
  category: in_dataset
  drugs: [alvimopan, ciprofloxacin]
  expect: correct_grounded
- id: grounded_ref_08
  category: in_dataset
  drugs: [drospirenone, boceprevir]
  expect: correct_grounded
- id: grounded_ref_09
  category: in_dataset
  drugs: ["elvitegravir (gs-9137)", ritonavir]
  expect: correct_grounded
- id: grounded_ref_10
  category: in_dataset
  drugs: [enfuvirtide, ritonavir]
  expect: correct_grounded

# Mechanism-overlap pairs (shared CYP enzymes, no direct reference DDI).
- id: grounded_mech_01
  category: in_dataset
  drugs: ["(s)-citalopram", diazepam]
  expect: correct_grounded
  note: shared CYP2C19 / CYP3A4
- id: grounded_mech_02
  category: in_dataset
  drugs: ["(s)-citalopram", clobazam]
  expect: correct_grounded
- id: grounded_mech_03
  category: in_dataset
  drugs: ["(s)-citalopram", bortezomib]
  expect: correct_grounded
- id: grounded_mech_04
  category: in_dataset
  drugs: ["(s)-citalopram", axitinib]
  expect: correct_grounded
- id: grounded_mech_05
  category: in_dataset
  drugs: ["(s)-citalopram", aripiprazole]
  expect: correct_grounded
- id: grounded_mech_06
  category: in_dataset
  drugs: ["(s)-citalopram", aliskiren]
  expect: correct_grounded

# ---------------------------------------------------------------------------
# 2) ABSENT — drug is NOT a lookup key (appears only as an inhibitor, or not
#    at all). Paired with a real drug so /check has its required 2 names.
#    Correct = refuse (missing_drug). /analyze must not silently substitute.
# ---------------------------------------------------------------------------
- id: absent_warfarin
  category: absent
  drugs: [warfarin, azilsartan]
  absent_drugs: [warfarin]
  expect: correct_refused
  note: warfarin appears only in the inhibitor column, never as a lookup key
- id: absent_ibuprofen
  category: absent
  drugs: [ibuprofen, azilsartan]
  absent_drugs: [ibuprofen]
  expect: correct_refused
- id: absent_digoxin
  category: absent
  drugs: [digoxin, azilsartan]
  absent_drugs: [digoxin]
  expect: correct_refused
- id: absent_simvastatin
