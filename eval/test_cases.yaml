  drugs: [Lipitor, azilsartan]
  absent_drugs: [lipitor]
  expect: correct_refused
- id: brand_tylenol
  category: brand_name
  drugs: [Tylenol, azilsartan]
  absent_drugs: [tylenol]
  expect: correct_refused
- id: brand_advil
  category: brand_name
  drugs: [Advil, azilsartan]
  absent_drugs: [advil]
