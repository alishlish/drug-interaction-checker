  expect: correct_refused

# ---------------------------------------------------------------------------
# 3) BRAND NAMES — dataset uses generic names, so brand strings are not keys.
#    Correct = refuse (or disclose no exact match), never silent substitution.
# ---------------------------------------------------------------------------
- id: brand_coumadin
  category: brand_name
  drugs: [Coumadin, azilsartan]
  absent_drugs: [coumadin]
  expect: correct_refused
  note: Coumadin = warfarin brand; warfarin itself is not even a key
- id: brand_diflucan
  category: brand_name
  drugs: [Diflucan, azilsartan]
  absent_drugs: [diflucan]
  expect: correct_refused
  note: Diflucan = fluconazole brand (fluconazole IS a key, the brand is not)
- id: brand_cipro
  category: brand_name
  drugs: [Cipro, azilsartan]
  absent_drugs: [cipro]
  expect: correct_refused
  note: Cipro = ciprofloxacin brand
- id: brand_prozac
